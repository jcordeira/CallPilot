[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173

# SPA fallback — function `path` configs win for /api/*
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
